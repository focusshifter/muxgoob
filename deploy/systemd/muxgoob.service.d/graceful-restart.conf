# Install on the bot host as:
#   sudo install -D -m 0644 deploy/systemd/muxgoob.service.d/graceful-restart.conf \
#     /etc/systemd/system/muxgoob.service.d/graceful-restart.conf
#   sudo systemctl daemon-reload
#
# The Gooby process handles SIGTERM by stopping Telegram polling, stopping cron,
# and draining in-flight handlers (including image generation) for up to 10 minutes.
[Service]
KillSignal=SIGTERM
TimeoutStopSec=10min
